<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1080" viewBox="0 0 1150 1080" font-family="Helvetica, Arial, sans-serif">
  <rect width="1150" height="1080" fill="#ffffff"/>
  <text x="575" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">
    Sequence Diagram — Full Shipment Lifecycle (Assignment #01)
  </text>
  <text x="575" y="45" text-anchor="middle" font-size="10.5" fill="#555">
    Every order-service status — PENDING, CONFIRMED, IN_TRANSIT, DELIVERED, CANCELLED — shown explicitly.
  </text>
  <text x="575" y="60" text-anchor="middle" font-size="10.5" fill="#555">
    All arrows are client-triggered — see 02-design.md §4.1. No status change happens automatically.
  </text>

  <!-- Lifelines -->
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <rect x="30" y="78" width="150" height="30" fill="#f4d9c6" stroke="#b5601b"/>
    <text x="105" y="98">Client (curl / Postman)</text>

    <rect x="330" y="78" width="140" height="30" fill="#eaf7ee" stroke="#2f9e44"/>
    <text x="400" y="98">order-service</text>

    <rect x="610" y="78" width="140" height="30" fill="#eaf7ee" stroke="#2f9e44"/>
    <text x="680" y="98">mission-service</text>

    <rect x="890" y="78" width="140" height="30" fill="#eaf7ee" stroke="#2f9e44"/>
    <text x="960" y="98">tracking-service</text>
  </g>

  <line x1="105" y1="108" x2="105" y2="1050" stroke="#999" stroke-dasharray="3,3"/>
  <line x1="400" y1="108" x2="400" y2="1050" stroke="#999" stroke-dasharray="3,3"/>
  <line x1="680" y1="108" x2="680" y2="1050" stroke="#999" stroke-dasharray="3,3"/>
  <line x1="960" y1="108" x2="960" y2="1050" stroke="#999" stroke-dasharray="3,3"/>

  <!-- STEP 1: create shipment -> PENDING -->
  <line x1="105" y1="140" x2="398" y2="140" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="250" y="133" text-anchor="middle" font-size="9.5">POST /shipments</text>
  <line x1="400" y1="160" x2="107" y2="160" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <rect x="180" y="164" width="140" height="16" rx="3" fill="#fde9c8" stroke="#c9a227"/>
  <text x="250" y="176" text-anchor="middle" font-size="8.5" font-weight="bold">status: PENDING ①</text>

  <!-- STEP 2: confirm -> CONFIRMED -->
  <line x1="105" y1="210" x2="398" y2="210" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="250" y="203" text-anchor="middle" font-size="9.5">PATCH /shipments/:id/status { "status": "CONFIRMED" }</text>
  <line x1="400" y1="230" x2="107" y2="230" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <rect x="180" y="234" width="150" height="16" rx="3" fill="#fde9c8" stroke="#c9a227"/>
  <text x="255" y="246" text-anchor="middle" font-size="8.5" font-weight="bold">status: CONFIRMED ②</text>

  <!-- Branch box: cancellation alternative -->
  <rect x="30" y="265" width="1080" height="80" fill="none" stroke="#8a2418" stroke-width="1.3" stroke-dasharray="6,3"/>
  <text x="45" y="280" font-size="9.5" font-weight="bold" fill="#8a2418">alt — customer cancels instead of proceeding (can happen from PENDING or CONFIRMED)</text>

  <line x1="105" y1="305" x2="398" y2="305" stroke="#c0392b" stroke-width="1.4" marker-end="url(#msgRed)"/>
  <text x="250" y="298" text-anchor="middle" font-size="9.5" fill="#8a2418">DELETE /shipments/:id</text>
  <line x1="400" y1="325" x2="107" y2="325" stroke="#c0392b" stroke-dasharray="5,3" marker-end="url(#msgRed)"/>
  <rect x="150" y="329" width="150" height="16" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="225" y="341" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#8a2418">status: CANCELLED ⑤ — flow ends here</text>

  <!-- resume main flow -->
  <text x="575" y="365" text-anchor="middle" font-size="9" font-style="italic" fill="#555">— otherwise, the main flow continues below —</text>

  <!-- STEP 3: create mission -->
  <line x1="105" y1="405" x2="678" y2="405" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="390" y="398" text-anchor="middle" font-size="9.5">POST /missions { shipmentId, origin, destination, packageWeight }</text>
  <rect x="650" y="415" width="60" height="18" fill="#fff3cd" stroke="#c9a227"/>
  <text x="680" y="428" text-anchor="middle" font-size="8">select drone</text>
  <line x1="680" y1="445" x2="107" y2="445" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <text x="390" y="440" text-anchor="middle" font-size="9" fill="#555">201 { id: MSN-xxx, droneId, status: IN_PROGRESS }</text>
  <text x="770" y="462" font-size="8.5" fill="#777" font-style="italic">mission-service's OWN status is now IN_PROGRESS —</text>
  <text x="770" y="474" font-size="8.5" fill="#777" font-style="italic">but order-service's status is still just CONFIRMED.</text>

  <!-- STEP 4: manually set order-service to IN_TRANSIT -->
  <line x1="105" y1="510" x2="398" y2="510" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="250" y="503" text-anchor="middle" font-size="9.5">PATCH /shipments/:id/status { "status": "IN_TRANSIT" }</text>
  <line x1="400" y1="530" x2="107" y2="530" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <rect x="175" y="534" width="160" height="16" rx="3" fill="#fde9c8" stroke="#c9a227"/>
  <text x="255" y="546" text-anchor="middle" font-size="8.5" font-weight="bold">status: IN_TRANSIT ③</text>
  <text x="770" y="522" font-size="8.5" fill="#8a2418" font-style="italic">⚠ Nothing does this automatically — the client must</text>
  <text x="770" y="534" font-size="8.5" fill="#8a2418" font-style="italic">issue this call itself after seeing the mission was created.</text>

  <!-- STEP 5: post tracking event -->
  <line x1="105" y1="575" x2="958" y2="575" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="520" y="568" text-anchor="middle" font-size="9.5">POST /track/:shipmentId/events { type: "MISSION_STARTED", ... }</text>
  <line x1="960" y1="593" x2="107" y2="593" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <text x="520" y="588" text-anchor="middle" font-size="9" fill="#555">201 Created</text>

  <!-- STEP 6: complete mission -->
  <line x1="105" y1="640" x2="678" y2="640" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="390" y="633" text-anchor="middle" font-size="9.5">PATCH /missions/:id/complete</text>
  <line x1="680" y1="658" x2="107" y2="658" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <text x="390" y="653" text-anchor="middle" font-size="9" fill="#555">200 { status: COMPLETED }</text>

  <!-- STEP 7: manually set order-service to DELIVERED -->
  <line x1="105" y1="705" x2="398" y2="705" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="250" y="698" text-anchor="middle" font-size="9.5">PATCH /shipments/:id/status { "status": "DELIVERED" }</text>
  <line x1="400" y1="725" x2="107" y2="725" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <rect x="175" y="729" width="160" height="16" rx="3" fill="#fde9c8" stroke="#c9a227"/>
  <text x="255" y="741" text-anchor="middle" font-size="8.5" font-weight="bold">status: DELIVERED ④</text>
  <text x="770" y="717" font-size="8.5" fill="#8a2418" font-style="italic">⚠ Again, the client must call this itself —</text>
  <text x="770" y="729" font-size="8.5" fill="#8a2418" font-style="italic">nothing propagates from mission-service automatically.</text>

  <!-- STEP 8: post delivered event -->
  <line x1="105" y1="775" x2="958" y2="775" stroke="#333" stroke-width="1.4" marker-end="url(#msg)"/>
  <text x="520" y="768" text-anchor="middle" font-size="9.5">POST /track/:shipmentId/events { type: "DELIVERED", progress: 100 }</text>
  <line x1="960" y1="793" x2="107" y2="793" stroke="#555" stroke-dasharray="5,3" marker-end="url(#msg)"/>
  <text x="520" y="788" text-anchor="middle" font-size="9" fill="#555">201 Created</text>

  <!-- Summary strip: all 5 states -->
  <rect x="30" y="845" width="1080" height="200" rx="6" fill="#f5f5f5" stroke="#888"/>
  <text x="50" y="868" font-size="12" font-weight="bold" fill="#111">order-service — all 5 possible `status` values, and how each is reached</text>

  <g font-size="9.5">
    <rect x="50" y="882" width="18" height="18" fill="#fde9c8" stroke="#c9a227"/>
    <text x="78" y="895">① PENDING — set automatically by POST /shipments (the only automatic one)</text>

    <rect x="50" y="906" width="18" height="18" fill="#fde9c8" stroke="#c9a227"/>
    <text x="78" y="919">② CONFIRMED — requires an explicit PATCH /shipments/:id/status call</text>

    <rect x="50" y="930" width="18" height="18" fill="#fde9c8" stroke="#c9a227"/>
    <text x="78" y="943">③ IN_TRANSIT — requires an explicit PATCH call; nothing links it to mission-service's own IN_PROGRESS state</text>

    <rect x="50" y="954" width="18" height="18" fill="#fde9c8" stroke="#c9a227"/>
    <text x="78" y="967">④ DELIVERED — requires an explicit PATCH call; nothing links it to mission-service's own COMPLETED state</text>

    <rect x="50" y="978" width="18" height="18" fill="#fdecea" stroke="#c0392b"/>
    <text x="78" y="991">⑤ CANCELLED — via DELETE /shipments/:id (see the alt-branch above); a terminal state, ends the flow</text>
  </g>

  <text x="50" y="1015" font-size="9" fill="#8a2418" font-style="italic">
    Note: the code accepts any of these 5 values via PATCH without enforcing a legal-transition order
  </text>
  <text x="50" y="1028" font-size="9" fill="#8a2418" font-style="italic">
    (e.g. PENDING → DELIVERED directly is technically accepted) — see 02-design.md for the discussion of this gap.
  </text>

  <defs>
    <marker id="msg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <marker id="msgRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
