<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">
    UML Domain Model — Aggregates, Entities &amp; Value Objects (02-design.md §3)
  </text>

  <!-- ============ BOOKING CONTEXT ============ -->
  <rect x="30" y="55" width="450" height="620" fill="none" stroke="#3b6fd6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="255" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#123a7a">Booking Context</text>

  <rect x="70" y="100" width="370" height="150" fill="#f4d9c6" stroke="#b5601b" stroke-width="1.6"/>
  <text x="255" y="120" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic">«Aggregate Root»</text>
  <text x="255" y="137" text-anchor="middle" font-size="13" font-weight="bold">Shipment</text>
  <line x1="70" y1="144" x2="440" y2="144" stroke="#b5601b"/>
  <text x="82" y="160" font-size="10">- id: String (e.g. SHP-001)</text>
  <text x="82" y="175" font-size="10">- customerId: String</text>
  <text x="82" y="190" font-size="10">- status: PENDING|CONFIRMED|IN_TRANSIT|</text>
  <text x="94" y="203" font-size="10">DELIVERED|CANCELLED</text>
  <line x1="70" y1="212" x2="440" y2="212" stroke="#b5601b"/>
  <text x="82" y="226" font-size="9.5">+ create() · + confirm() · + cancel() · + changeStatus()</text>
  <text x="82" y="240" font-size="9" font-style="italic" fill="#555">invariant: origin, destination, packageSpec required</text>

  <rect x="70" y="285" width="170" height="76" fill="#e4f0ff" stroke="#3b6fd6" stroke-width="1.4"/>
  <text x="155" y="303" text-anchor="middle" font-size="11" font-style="italic">«Value Object»</text>
  <text x="155" y="318" text-anchor="middle" font-size="12" font-weight="bold">Location</text>
  <line x1="70" y1="324" x2="240" y2="324" stroke="#3b6fd6"/>
  <text x="80" y="337" font-size="9">address, lat, lon</text>
  <text x="80" y="350" font-size="9" font-style="italic" fill="#555">used for origin &amp; destination</text>

  <rect x="270" y="285" width="170" height="76" fill="#e4f0ff" stroke="#3b6fd6" stroke-width="1.4"/>
  <text x="355" y="303" text-anchor="middle" font-size="11" font-style="italic">«Value Object»</text>
  <text x="355" y="318" text-anchor="middle" font-size="12" font-weight="bold">PackageSpec</text>
  <line x1="270" y1="324" x2="440" y2="324" stroke="#3b6fd6"/>
  <text x="280" y="337" font-size="9">weight: Number</text>
  <text x="280" y="350" font-size="9">fragile: Boolean</text>

  <rect x="70" y="385" width="370" height="66" fill="#e4f0ff" stroke="#3b6fd6" stroke-width="1.4"/>
  <text x="255" y="403" text-anchor="middle" font-size="11" font-style="italic">«Value Object»</text>
  <text x="255" y="418" text-anchor="middle" font-size="12" font-weight="bold">TimeWindow</text>
  <line x1="70" y1="424" x2="440" y2="424" stroke="#3b6fd6"/>
  <text x="80" y="438" font-size="9">earliest: DateTime · latest: DateTime | null</text>

  <line x1="255" y1="250" x2="155" y2="283" stroke="#333" marker-end="url(#comp)"/>
  <line x1="255" y1="250" x2="355" y2="283" stroke="#333" marker-end="url(#comp)"/>
  <line x1="255" y1="250" x2="255" y2="383" stroke="#333" marker-end="url(#comp)"/>

  <rect x="70" y="500" width="370" height="130" fill="#fdf3d6" stroke="#a08312" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="255" y="520" text-anchor="middle" font-size="11" font-weight="bold">Domain events raised</text>
  <text x="90" y="540" font-size="10">• ShipmentPlaced</text>
  <text x="90" y="558" font-size="10">• ShipmentStatusChanged</text>
  <text x="90" y="576" font-size="10">• ShipmentCancelled</text>
  <text x="90" y="600" font-size="9" fill="#8a2418" font-weight="bold">⚠ Not consumed automatically by other</text>
  <text x="90" y="614" font-size="9" fill="#8a2418">contexts in this prototype (see 02-design.md §4.1)</text>

  <!-- ============ MISSION CONTEXT ============ -->
  <rect x="510" y="55" width="480" height="620" fill="none" stroke="#3b6fd6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="750" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#123a7a">Mission / Dispatch Context</text>

  <rect x="550" y="100" width="400" height="150" fill="#f4d9c6" stroke="#b5601b" stroke-width="1.6"/>
  <text x="750" y="120" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic">«Aggregate Root»</text>
  <text x="750" y="137" text-anchor="middle" font-size="13" font-weight="bold">Mission</text>
  <line x1="550" y1="144" x2="950" y2="144" stroke="#b5601b"/>
  <text x="562" y="160" font-size="10">- id: String (e.g. MSN-001)</text>
  <text x="562" y="175" font-size="10">- shipmentId: String (ref. to Booking ctx)</text>
  <text x="562" y="190" font-size="10">- droneId: String (ref. to Drone)</text>
  <text x="562" y="205" font-size="10">- status: IN_PROGRESS|COMPLETED|ABORTED</text>
  <line x1="550" y1="212" x2="950" y2="212" stroke="#b5601b"/>
  <text x="562" y="226" font-size="9.5">+ create() · + complete() · + abort()</text>
  <text x="562" y="240" font-size="9" font-style="italic" fill="#555">invariant: drone must be AVAILABLE, battery &gt; threshold</text>

  <rect x="550" y="285" width="185" height="90" fill="#e4f0ff" stroke="#3b6fd6" stroke-width="1.4"/>
  <text x="642" y="303" text-anchor="middle" font-size="11" font-style="italic">«Value Object»</text>
  <text x="642" y="318" text-anchor="middle" font-size="12" font-weight="bold">Route</text>
  <line x1="550" y1="324" x2="735" y2="324" stroke="#3b6fd6"/>
  <text x="560" y="337" font-size="9">waypoints: [Waypoint]</text>
  <text x="560" y="358" font-size="8.5" font-style="italic" fill="#555">(order, lat, lon, alt, label)</text>

  <rect x="765" y="285" width="185" height="90" fill="#f4e2cf" stroke="#b5601b" stroke-width="1.4"/>
  <text x="857" y="303" text-anchor="middle" font-size="11" font-style="italic">«Entity» (Fleet)</text>
  <text x="857" y="318" text-anchor="middle" font-size="12" font-weight="bold">Drone</text>
  <line x1="765" y1="324" x2="950" y2="324" stroke="#b5601b"/>
  <text x="775" y="337" font-size="9">id, model, battery,</text>
  <text x="775" y="350" font-size="9">maxPayload, status</text>
  <text x="775" y="365" font-size="8" font-style="italic" fill="#555">outlives any single mission</text>

  <line x1="750" y1="250" x2="642" y2="283" stroke="#333" marker-end="url(#comp)"/>
  <line x1="750" y1="250" x2="857" y2="283" stroke="#333" marker-end="url(#agg)"/>
  <text x="800" y="270" font-size="8" fill="#555">references</text>

  <rect x="550" y="500" width="400" height="130" fill="#fdf3d6" stroke="#a08312" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="750" y="520" text-anchor="middle" font-size="11" font-weight="bold">Domain events raised</text>
  <text x="570" y="540" font-size="10">• MissionStarted</text>
  <text x="570" y="558" font-size="10">• MissionCompleted</text>
  <text x="570" y="576" font-size="10">• MissionAborted</text>
  <text x="570" y="600" font-size="9" fill="#8a2418" font-weight="bold">⚠ Not consumed automatically by</text>
  <text x="570" y="614" font-size="9" fill="#8a2418">tracking-service in this prototype (see §4.1)</text>

  <!-- ============ TRACKING CONTEXT ============ -->
  <rect x="1020" y="55" width="450" height="620" fill="none" stroke="#3b6fd6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1245" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#123a7a">Tracking Context</text>

  <rect x="1060" y="100" width="370" height="150" fill="#f4d9c6" stroke="#b5601b" stroke-width="1.6"/>
  <text x="1245" y="120" text-anchor="middle" font-size="12" font-weight="bold" font-style="italic">«Aggregate Root»</text>
  <text x="1245" y="137" text-anchor="middle" font-size="13" font-weight="bold">TrackingRecord</text>
  <line x1="1060" y1="144" x2="1430" y2="144" stroke="#b5601b"/>
  <text x="1072" y="160" font-size="10">- shipmentId: String (correlation key,</text>
  <text x="1090" y="173" font-size="10">NOT a foreign key)</text>
  <text x="1072" y="188" font-size="10">- currentLocation, eta, progress, droneId</text>
  <line x1="1060" y1="196" x2="1430" y2="196" stroke="#b5601b"/>
  <text x="1072" y="210" font-size="9.5">+ addEvent() · + getEta()</text>
  <text x="1072" y="224" font-size="9" font-style="italic" fill="#555">invariant: events are append-only, never mutated</text>
  <text x="1072" y="238" font-size="9" font-style="italic" fill="#555">or deleted</text>

  <rect x="1060" y="285" width="370" height="90" fill="#e4f0ff" stroke="#3b6fd6" stroke-width="1.4"/>
  <text x="1245" y="303" text-anchor="middle" font-size="11" font-style="italic">«Value Object» (repeated 0..*)</text>
  <text x="1245" y="318" text-anchor="middle" font-size="12" font-weight="bold">TrackingEvent</text>
  <line x1="1060" y1="324" x2="1430" y2="324" stroke="#3b6fd6"/>
  <text x="1072" y="337" font-size="9">timestamp: DateTime</text>
  <text x="1072" y="350" font-size="9">type: String (e.g. WAYPOINT_REACHED)</text>
  <text x="1072" y="363" font-size="9">description: String</text>

  <line x1="1245" y1="250" x2="1245" y2="283" stroke="#333" marker-end="url(#comp)"/>
  <text x="1290" y="270" font-size="9" fill="#555">1 .. *</text>

  <rect x="1060" y="500" width="370" height="130" fill="#fdf3d6" stroke="#a08312" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="1245" y="520" text-anchor="middle" font-size="11" font-weight="bold">Domain events consumed</text>
  <text x="1080" y="540" font-size="10">Conceptually: anything Mission publishes</text>
  <text x="1080" y="558" font-size="9" fill="#8a2418" font-weight="bold">⚠ In this prototype: nothing is actually</text>
  <text x="1080" y="572" font-size="9" fill="#8a2418">consumed automatically — events only</text>
  <text x="1080" y="586" font-size="9" fill="#8a2418">arrive via an explicit POST from an</text>
  <text x="1080" y="600" font-size="9" fill="#8a2418">external client (see §4.1–4.2)</text>

  <!-- Legend -->
  <rect x="30" y="695" width="1440" height="55" fill="#fafafa" stroke="#ccc"/>
  <line x1="50" y1="713" x2="90" y2="713" stroke="#333" marker-end="url(#comp)"/>
  <text x="98" y="717" font-size="10">Composition (part cannot exist without the whole)</text>
  <line x1="420" y1="713" x2="460" y2="713" stroke="#333" marker-end="url(#agg)"/>
  <text x="468" y="717" font-size="10">Aggregation / reference (part can exist independently — e.g. Drone outlives a Mission)</text>
  <text x="50" y="737" font-size="9.5" fill="#555">Cross-context relationships (Customer/Supplier, Published Language, Separate Ways) are shown in 02-design.md §2's context map, not repeated here.</text>

  <defs>
    <marker id="comp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,5 L5,0 L10,5 L5,10 z" fill="#333"/>
    </marker>
    <marker id="agg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,5 L5,0 L10,5 L5,10 z" fill="#fff" stroke="#333"/>
    </marker>
  </defs>
</svg>
