openapi: 3.0.3
info:
  title: Drone Logistics Platform API (Assignment #02)
  description: >-
    Unified OpenAPI specification for Order Service (Event Sourcing/CQRS),
    Mission Service (Drone Orchestration & Gateway Protection), and Tracking
    Service (CQRS Read Model). Features include `/health` status and `/metrics`
    Prometheus scraping endpoints.
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway / Reverse Proxy
  - url: http://localhost:3001
    description: Order Service (Direct)
  - url: http://localhost:3002
    description: Tracking Service (Direct)
  - url: http://localhost:3003
    description: Mission Service (Direct)

tags:
  - name: Order Service
    description: Command-side and CQRS Query-side for shipment operations.
  - name: Mission Service
    description: Drone fleet management and mission dispatching.
  - name: Tracking Service
    description: CQRS Read Model for shipment telematics and timeline tracking.
  - name: Observability
    description: Health diagnostics and Prometheus metrics endpoints.

paths:
  # ── ORDER SERVICE ENDPOINTS ──────────────────────────────────────────────────
  /shipments:
    get:
      tags:
        - Order Service
      summary: List all shipments (CQRS Read Model)
      responses:
        '200':
          description: Array of shipment read models.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipmentProjection'
    post:
      tags:
        - Order Service
      summary: Place a new shipment (Command)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin:
                  type: string
                  example: Milan Central
                destination:
                  type: string
                  example: Rome Termini
                weightKg:
                  type: number
                  format: float
                  example: 1.5
      responses:
        '201':
          description: Shipment successfully placed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: SHP-A1B2C3
                  status:
                    type: string
                    example: PENDING
        '400':
          description: Invalid command payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shipments/{id}:
    get:
      tags:
        - Order Service
      summary: Get shipment view by ID (CQRS Read Model)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      responses:
        '200':
          description: Shipment detail projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentProjection'
        '404':
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Order Service
      summary: Cancel a shipment (Command)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      responses:
        '200':
          description: Shipment cancellation recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Shipment cancelled
                  id:
                    type: string
                    example: SHP-A1B2C3
        '400':
          description: Cannot cancel shipment in current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shipments/{id}/confirm:
    post:
      tags:
        - Order Service
      summary: Confirm a shipment order (Command)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      responses:
        '200':
          description: Shipment marked as CONFIRMED.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: SHP-A1B2C3
                  status:
                    type: string
                    example: CONFIRMED
        '400':
          description: Invalid state transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shipments/{id}/drone:
    post:
      tags:
        - Order Service
      summary: Assign a drone to a shipment (Command)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - droneId
              properties:
                droneId:
                  type: string
                  example: DRN-ALPHA
      responses:
        '200':
          description: Drone successfully assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: SHP-A1B2C3
                  droneId:
                    type: string
                    example: DRN-ALPHA
        '400':
          description: Invalid operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shipments/{id}/status:
    patch:
      tags:
        - Order Service
      summary: Update shipment status (Command)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, IN_TRANSIT, DELIVERED, CANCELLED]
                  example: IN_TRANSIT
      responses:
        '200':
          description: Status updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: SHP-A1B2C3
                  status:
                    type: string
                    example: IN_TRANSIT
        '400':
          description: Invalid status value or state transition error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shipments/{id}/events:
    get:
      tags:
        - Order Service
      summary: Retrieve aggregate event stream audit log (Event Sourcing)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      responses:
        '200':
          description: Raw domain event stream for the specified aggregate ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainEvent'
        '404':
          description: Shipment event stream not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── MISSION SERVICE ENDPOINTS ────────────────────────────────────────────────
  /drones:
    get:
      tags:
        - Mission Service
      summary: Get drone fleet status
      responses:
        '200':
          description: List of fleet drones and status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drone'

  /missions:
    get:
      tags:
        - Mission Service
      summary: List all active and completed missions
      responses:
        '200':
          description: Array of mission records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mission'
    post:
      tags:
        - Mission Service
      summary: Create and dispatch a mission for a shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipmentId
              properties:
                shipmentId:
                  type: string
                  example: SHP-A1B2C3
                weightKg:
                  type: number
                  format: float
                  example: 2.0
      responses:
        '201':
          description: Mission assigned and created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '400':
          description: Missing mandatory parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No suitable drone available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /missions/{id}/complete:
    post:
      tags:
        - Mission Service
      summary: Complete an ongoing mission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: MSN-F3A219
      responses:
        '200':
          description: Mission completed and drone returned to IDLE status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          description: Mission not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── TRACKING SERVICE ENDPOINTS ───────────────────────────────────────────────
  /events:
    post:
      tags:
        - Tracking Service
      summary: Event intake endpoint for domain event-carried state transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainEvent'
      responses:
        '202':
          description: Event successfully processed into tracking read model.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
        '400':
          description: Malformed event payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tracking:
    get:
      tags:
        - Tracking Service
      summary: Get all tracking read model entries
      responses:
        '200':
          description: Array of tracking views.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingEntry'

  /tracking/{shipmentId}:
    get:
      tags:
        - Tracking Service
      summary: Get tracking read model entry for a specific shipment
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema:
            type: string
          example: SHP-A1B2C3
      responses:
        '200':
          description: Tracking view and timeline details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingEntry'
        '404':
          description: No tracking information found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── OBSERVABILITY ENDPOINTS ──────────────────────────────────────────────────
  /health:
    get:
      tags:
        - Observability
      summary: Microservice liveness and dependency check
      responses:
        '200':
          description: Service health indicator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /metrics:
    get:
      tags:
        - Observability
      summary: Prometheus metric exposition endpoint
      responses:
        '200':
          description: Prometheus formatted metrics payload.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP process_cpu_user_seconds_total Total user CPU time spent in seconds.
                  # TYPE process_cpu_user_seconds_total counter
                  process_cpu_user_seconds_total 0.05

components:
  schemas:
    ShipmentProjection:
      type: object
      properties:
        id:
          type: string
          example: SHP-A1B2C3
        origin:
          type: string
          example: Milan Central
        destination:
          type: string
          example: Rome Termini
        weightKg:
          type: number
          format: float
          example: 1.5
        status:
          type: string
          enum: [PENDING, CONFIRMED, IN_TRANSIT, DELIVERED, CANCELLED]
          example: IN_TRANSIT
        droneId:
          type: string
          nullable: true
          example: DRN-ALPHA

    DomainEvent:
      type: object
      required:
        - type
        - aggregateId
      properties:
        id:
          type: string
          example: evt_89123847
        type:
          type: string
          example: ShipmentPlaced
        aggregateId:
          type: string
          example: SHP-A1B2C3
        occurredAt:
          type: string
          format: date-time
          example: "2026-07-25T11:48:22Z"
        data:
          type: object
          additionalProperties: true

    Drone:
      type: object
      properties:
        id:
          type: string
          example: DRN-ALPHA
        model:
          type: string
          example: SkyCarrier X2
        maxPayloadKg:
          type: number
          format: float
          example: 3.0
        batteryPct:
          type: integer
          example: 96
        status:
          type: string
          enum: [IDLE, ON_MISSION]
          example: IDLE

    Mission:
      type: object
      properties:
        id:
          type: string
          example: MSN-F3A219
        shipmentId:
          type: string
          example: SHP-A1B2C3
        droneId:
          type: string
          example: DRN-ALPHA
        phase:
          type: string
          enum: [TAKEOFF, IN_FLIGHT, LANDING, COMPLETED]
          example: TAKEOFF
        startedAt:
          type: string
          format: date-time
          example: "2026-07-25T11:48:22Z"
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: null

    TimelineEntry:
      type: object
      properties:
        event:
          type: string
          example: ShipmentPlaced
        at:
          type: string
          format: date-time
          example: "2026-07-25T11:48:22Z"
        details:
          type: object
          additionalProperties: true

    TrackingEntry:
      type: object
      properties:
        shipmentId:
          type: string
          example: SHP-A1B2C3
        status:
          type: string
          enum: [PENDING, CONFIRMED, IN_TRANSIT, DELIVERED, CANCELLED]
          example: IN_TRANSIT
        droneId:
          type: string
          nullable: true
          example: DRN-ALPHA
        etaMinutes:
          type: integer
          nullable: true
          example: 20
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'

    HealthCheck:
      type: object
      properties:
        service:
          type: string
          example: order-service
        status:
          type: string
          example: UP
        version:
          type: string
          example: 2.0.0
        checks:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
          example: "2026-07-25T11:48:22Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Shipment not found

