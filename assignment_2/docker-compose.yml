# Shipping on the Air — Assignment #02 deployment (software containers)
# Single entry point: the API gateway on :8080. Prometheus scrapes every
# service's /metrics endpoint (application metrics pattern).
services:

  api-gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8080:8080"          # the ONLY port clients need
    environment:
      - PORT=8080
      - ORDER_URL=http://order-service:3001
      - TRACKING_URL=http://tracking-service:3002
      - MISSION_URL=http://mission-service:3003
      - CB_FAILURE_THRESHOLD=3
      - CB_RESET_TIMEOUT_MS=10000
    depends_on: [order-service, tracking-service, mission-service]
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    container_name: order-service
    expose: ["3001"]
    ports:
      - "3001:3001"          # exposed for Prometheus / debugging only
    environment:
      - PORT=3001
      - EVENT_STORE_FILE=/app/data/events.jsonl
      - TRACKING_URL=http://tracking-service:3002
    volumes:
      - order-events:/app/data   # the event log survives restarts
    restart: unless-stopped

  tracking-service:
    build: ./services/tracking-service
    container_name: tracking-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    restart: unless-stopped

  mission-service:
    build: ./services/mission-service
    container_name: mission-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - ORDER_URL=http://order-service:3001
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api-gateway]
    restart: unless-stopped
    
    

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      # Map the actual project root files to /app inside the container
      - .:/app
      # Protect container's node_modules from being overwritten by your Mac's host
      - /app/node_modules
      # Hide the backend microservices folders so they don't loop inside the frontend
      - /app/services
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - order-service
      - tracking-service
      - mission-service
    restart: unless-stopped
    
    

  # ── Swagger UI for API Documentation ───────────────────────────────────────
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: drone-api-docs
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_JSON=/app/openapi.yaml
    volumes:
      - ./openapi.yaml:/app/openapi.yaml

volumes:
  order-events:
